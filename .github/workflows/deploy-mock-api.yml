name: Deploy mock API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mock-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: mock-api-production
    defaults:
      run:
        working-directory: mock-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.8.0
          cache: pnpm
          cache-dependency-path: mock-api/pnpm-lock.yaml
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mock-api
          packageManager: pnpm
          command: deploy
      - name: Verify deployed health
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/verify-health.mjs > health-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mock-api-health-receipt
          path: mock-api/health-receipt.json
          if-no-files-found: error
